name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            web/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test engine
        working-directory: engine
        run: npm test

      # tsc over engine/src; vitest transpiles without typechecking.
      - name: Typecheck engine
        working-directory: engine
        run: npm run build

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      # Same build the Pages workflow runs, so a broken public build fails the
      # PR instead of the deploy.
      - name: Build public site
        working-directory: web
        run: npm run build:public
